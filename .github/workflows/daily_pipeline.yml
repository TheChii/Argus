name: Argus Quant Daily Pipeline

on:
  schedule:
    # 21:15 UTC (16:15 ET / 17:15 EDT) Monday through Friday after US market close
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force re-sync prices and macro'
        required: false
        default: 'false'
        type: boolean
      force_rebalance:
        description: 'Force execute portfolio rebalance and weekly report'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-pipeline:
    name: Run End-Of-Day Quant Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build C++ Acceleration Engine
        run: |
          make -C src/features

      - name: Execute Daily Production Pipeline
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.force_sync }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --force"
          fi
          if [ "${{ inputs.force_rebalance }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --rebalance"
          else
            EXTRA_FLAGS="$EXTRA_FLAGS --auto-rebalance"
          fi

          python main.py run-daily --commit-holdings $EXTRA_FLAGS
          python main.py status

      - name: Upload Daily Scores & Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-pipeline-outputs-${{ github.run_id }}
          path: |
            data/scores/
            data/reports/
            data/portfolio/
            data/logs/
          retention-days: 90
