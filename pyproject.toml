[project]
name = "argus-quant"
version = "2.3.0"
description = "Systematic AI Investing Engine with C++ OpenMP Acceleration, Barra Factor Risk Model, and Intraday Risk Management"
authors = [{ name = "Argus Quant Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, variables, undefined names)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python 3.12 syntax)
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line length handled loosely for long formulas/docstrings
    "E402",  # Module level import not at top of file (used for sys.path hacks in scripts)
    "C408",  # Unnecessary dict/list call (sometimes preferred for clarity)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
